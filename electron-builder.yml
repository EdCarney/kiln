appId: local.kiln.app
productName: Kiln
directories:
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  # Both chips; no native modules (node:sqlite is built into Electron), so the x64 build
  # cross-packages fine on an Apple Silicon machine.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Stable names so releases/latest/download/Kiln-arm64.zip always points at the newest build.
  artifactName: ${productName}-${arch}.${ext}
  # No Developer ID yet: sign ad hoc so arm64 gets a valid signature. Hardened runtime would
  # enforce library validation and refuse Electron's own frameworks under an ad-hoc signature.
  identity: '-'
  hardenedRuntime: false
