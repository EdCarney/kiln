name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      # Upload with gh instead of electron-builder's publisher, which makes a draft release
      # that releases/latest/download/ can't see.
      - run: npx electron-builder --mac --publish never
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Kiln ${GITHUB_REF_NAME#v}" \
            dist/Kiln-arm64.zip dist/Kiln-x64.zip dist/Kiln-arm64.dmg dist/Kiln-x64.dmg
