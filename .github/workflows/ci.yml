name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs 22.13+ unflagged; the tests open a real in-memory database.
          node-version: 22
          cache: npm
      # Typecheck and unit tests don't need the Electron binary.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm test
